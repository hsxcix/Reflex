[package]
name = "reflex-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = []
# GPU backend (Metal on macOS, Vulkan/CUDA elsewhere) for offline pretraining.
gpu = ["burn/wgpu"]

[dependencies]
burn.workspace = true
rusqlite.workspace = true
zstd.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
rand_distr = "0.5"
uniffi.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
