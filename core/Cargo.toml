[workspace]
resolver = "3"
members = ["reflex-core", "reflex-cli", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
burn = { version = "0.22.1", default-features = false, features = ["std", "flex", "autodiff", "optim"] }
rusqlite = { version = "0.43", features = ["bundled"] }
zstd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
uniffi = "0.32.2"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 4
debug = false

[profile.dev.package."*"]
opt-level = 3
